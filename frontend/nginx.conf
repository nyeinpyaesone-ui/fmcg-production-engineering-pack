# Runs as non-root on 8080 (see Dockerfile USER/EXPOSE). Backend stays on the
# private compose network; only this port is published to the host.
server {
  listen 8080;
  server_name _;

  # Single-page app: static files first, index fallback for client routes.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  # API liveness probe, proxied to the backend service (compose DNS name).
  location /health {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }
}
