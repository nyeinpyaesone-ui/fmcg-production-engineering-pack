# Runs as non-root on 8080 (see Dockerfile USER/EXPOSE). Backend stays on the
# private compose network; only this port is published to the host.
server {
  listen 8080;
  server_name _;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Single-page app: static files first, index fallback for client routes.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  # API liveness probe, exact match only: the backend defines exactly /health,
  # so /health/* must not proxy anywhere. Proxied to backend:8000 (compose DNS).
  location = /health {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
