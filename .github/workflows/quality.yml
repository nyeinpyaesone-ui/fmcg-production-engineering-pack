name: quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # Full history: gitleaks scans the PR base..head range, which a shallow checkout cannot resolve.
          fetch-depth: 0
      # TODO: verify and pin setup-python / gitleaks to reviewed immutable SHAs before release.
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11.17"
      - name: Lint YAML config
        run: pipx run yamllint -c .yamllint.yaml config/agent-policy.yaml
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "README.md" "docs/**/*.md" ".agents/**/*.md"
      - name: Docs integrity check
        run: python3 scripts/check_docs.py
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.7
        env:
          # Required by gitleaks-action to scan pull_request events.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11.17"
      - run: pip install -r backend/requirements-dev.txt
      - run: |
          cd backend
          ruff check .
          mypy app
          pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8  # v4.0.2
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run check --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
