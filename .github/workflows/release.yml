name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Fails closed unless the quality workflow succeeded on the exact commit
  # being released. This intentionally blocks manual dispatches from commits
  # without a green quality run. jq -e exits nonzero when false, failing the job.
  verify-quality:
    runs-on: ubuntu-latest
    # Least privilege: gh run list needs actions:read, which the top-level
    # contents:read does not grant.
    permissions:
      actions: read
    steps:
      - name: Verify quality workflow succeeded on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --commit ${{ github.sha }} \
            --workflow quality.yml --status completed \
            --json conclusion \
            --jq -e '[.[].conclusion] | index("success") != null'
  build-and-push:
    needs: verify-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # NOTE: docker/setup-buildx was renamed to docker/setup-buildx-action upstream.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
        with:
          driver: docker-container
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub mirror. Credentials live only as repository secrets
      # (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN), set by the owner via
      # `gh secret set` — values never appear in this file or its logs.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Backend metadata
        id: backend-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/fmcg-erp-backend
            ${{ vars.DOCKERHUB_NAMESPACE }}/fmcg-erp-backend
          tags: |
            type=ref,event=tag
            type=sha,prefix=
      - name: Frontend metadata
        id: frontend-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/fmcg-erp-frontend
            ${{ vars.DOCKERHUB_NAMESPACE }}/fmcg-erp-frontend
          tags: |
            type=ref,event=tag
            type=sha,prefix=
      - name: Build and push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Build and push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          sbom: true
          provenance: mode=max
